<!DOCTYPE html>
<html>
<head>
<title>Train Reservation System</title>
</head>

<body bgcolor="lightcyan">

<h1 align="center">Train Reservation System</h1>

<form>

Passenger Name :
<input type="text"><br><br>

Train Number :
<input type="text"><br><br>

Train Name :
<input type="text"><br><br>

From :
<input type="text"><br><br>

To :
<input type="text"><br><br>

Travel Date :
<input type="date"><br><br>

Class :
<select>
<option>Sleeper</option>
<option>3A</option>
<option>2A</option>
<option>1A</option>
</select>

<br><br>

<input type="submit" value="Reserve Ticket">
<input type="reset" value="Cancel">

</form>

</body>
</html>
