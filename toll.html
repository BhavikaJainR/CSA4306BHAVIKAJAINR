<!DOCTYPE html>
<html>
<head>
<title>Online Toll Payment System</title>
</head>
<body>

<h1 align="center">Online Toll Payment System</h1>

<form>

Vehicle Number :
<input type="text"><br><br>

Vehicle Type :
<select>
<option>Car</option>
<option>Bus</option>
<option>Truck</option>
<option>Bike</option>
</select>

<br><br>

Toll Plaza :
<input type="text"><br><br>

Payment Method :
<select>
<option>UPI</option>
<option>Debit Card</option>
<option>Credit Card</option>
<option>Net Banking</option>
</select>

<br><br>

<input type="submit" value="Pay Toll">
<input type="reset" value="Clear">

</form>

</body>
</html>
